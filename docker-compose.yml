services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: LEXI_LEDGER_USER
      POSTGRES_PASSWORD: LEXI_LEDGER_PASS
      POSTGRES_DB: lexi_ledger
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://LEXI_LEDGER_USER:LEXI_LEDGER_PASS@postgres:5432/lexi_ledger?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      REDIS_PASSWORD: ""
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
